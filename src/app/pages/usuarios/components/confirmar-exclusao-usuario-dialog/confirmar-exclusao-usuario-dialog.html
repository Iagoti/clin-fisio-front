<h2 mat-dialog-title class="dialog-title">
  <mat-icon class="dialog-title__icon" aria-hidden="true">warning</mat-icon>
  {{ titulo }}
</h2>
<mat-dialog-content class="dialog-content">
  <p>{{ mensagem }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end" class="dialog-actions">
  <button mat-button type="button" (click)="cancelar()">{{ textoCancelar }}</button>
  <button mat-flat-button type="button" class="btn-confirmar-exclusao" (click)="confirmar()">
    {{ textoConfirmar }}
  </button>
</mat-dialog-actions>
