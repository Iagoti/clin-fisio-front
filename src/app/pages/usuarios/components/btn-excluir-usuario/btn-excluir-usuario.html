<button
  type="button"
  mat-button
  class="btn-excluir-usuario"
  [disabled]="excluindo"
  (click)="onClick()"
>
  <span class="btn-content">
    @if (excluindo) {
      <mat-spinner class="btn-excluir-usuario__spinner" diameter="20"></mat-spinner>
    } @else {
      <mat-icon>delete</mat-icon>
      <span>Excluir</span>
    }
  </span>
</button>
